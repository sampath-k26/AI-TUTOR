services:
  - type: web
    name: ai-tutor-api
    runtime: node
    rootDir: apps/api
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.19.1
      - key: PORT
        value: 4000
      - key: NODE_ENV
        value: production
      - key: RUN_WORKER_IN_API_PROCESS
        value: "true"
      - key: CORS_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: materials
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_BASE_URL
        value: https://cloud.langfuse.com
# No separate `worker` service: Render's free plan doesn't support the
# Background Worker service type. RUN_WORKER_IN_API_PROCESS above makes
# ai-tutor-api also run the pg-boss workers in-process instead. If/when this
# ever moves to a paid plan, split it back out into its own `type: worker`
# service (startCommand: npm run worker:start) and remove that env var.
